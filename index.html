<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ethereal UI: The Living Interface</title>
  <link rel="stylesheet" href="/src/styles.css">
  <style>
    /* Critical CSS for initial loading */
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #ffffff;
      background: #0a0a12;
      -webkit-font-smoothing: antialiased;
    }
    
    #app {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #0a0a12;
      z-index: 1000;
      transition: opacity 0.5s ease-out;
    }
    
    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #4a6cf7;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 16px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Loading screen (will be hidden by JavaScript) -->
  <div class="loading-screen">
    <div class="loading-spinner"></div>
    <div>Initializing Ethereal UI...</div>
  </div>
  
  <!-- Three.js will render into this div -->
  <div id="app"></div>
  
  <!-- UI Overlay elements -->
  <div class="ui-overlay">
    <div class="ui-title" data-3d-position="0,2.5,0">
      <h1>Ethereal UI</h1>
      <p class="subtitle">The Living Interface</p>
    </div>
    
    <div class="ui-tooltip" id="tooltip"></div>
    
    <div class="ui-controls">
      <div class="control-group" data-3d-position="-3,0,0">
        <label>Light Intensity</label>
        <input type="range" min="0" max="2" step="0.1" value="1" id="light-intensity">
      </div>
      
      <div class="control-group" data-3d-position="3,0,0">
        <label>Atmosphere Density</label>
        <input type="range" min="0" max="1" step="0.05" value="0.3" id="fog-density">
      </div>
    </div>
  </div>
  
  <!-- Import Three.js and our app -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
